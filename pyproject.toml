[project]
name = "gea-agents-arch-guidelines-mcp-server"
version = "0.1.0"
description = "Enterprise Agents Architectural Guidelines MCP Server with Spanner Graph and BigQuery backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GEA Architecture Team" }
]
dependencies = [
    "fastmcp>=0.4.1",
    "google-cloud-spanner>=3.45.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-trace>=1.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "uvicorn>=0.29.0",
    "networkx>=3.2.0",
    "rdflib>=7.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "google-genai>=0.1.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
    "opentelemetry-instrumentation>=0.45b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
gea-mcp-server = "src.server:main"
nl2kg-pipeline = "pipelines.nl2kg_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "pipelines"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
